{% extends "emails/base_email.html" %}
{% block title %}Announcement: {{ title }}{% endblock %}
{% block preheader %}{{ title }}{% endblock %}

{% block body %}
<h2 style="margin:0 0 16px 0; font-family:'Segoe UI',Arial,sans-serif; color:#01411C; font-size:20px;">
    📢 {{ title }}
</h2>

<p style="margin:0 0 16px 0; font-family:'Segoe UI',Arial,sans-serif; font-size:14px; color:#1E1E1E; line-height:1.6; white-space:pre-line;">
    {{ body }}
</p>

{% if posted_by %}
<p style="margin:0 0 16px 0; font-family:'Segoe UI',Arial,sans-serif; font-size:13px; color:#5E6A61;">
    &mdash; {{ posted_by }}
</p>
{% endif %}

<table role="presentation" cellpadding="0" cellspacing="0">
    <tr>
        <td style="border-radius:8px; background-color:#01411C;">
            <a href="{{ dashboard_url }}" target="_blank"
               style="display:inline-block; padding:12px 28px; font-family:'Segoe UI',Arial,sans-serif; font-size:14px; font-weight:600; color:#FFFFFF; text-decoration:none; border-radius:8px;">
                Open Portal
            </a>
        </td>
    </tr>
</table>
{% endblock %}
